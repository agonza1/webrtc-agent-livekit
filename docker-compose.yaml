networks:
  lknetwork:
  
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    # network_mode: "host"
    ports:
    - "7880:7880"
    - "7881:7881"
    - "7882:7882"
    - "50100-50200:50100-50200"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
      - ./certs:/etc/certs
    depends_on:
      - redis
    networks:
      - lknetwork
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - lknetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  agents-playground:
    build:
      context: ./agents-playground
    volumes:
      - ./agents-playground:/usr/src/app
      - /usr/src/app/node_modules   # Avoid overwriting node_modules
    env_file:
      - ./agents-playground.yaml  # Load the environment variables from the YAML file
    ports:
      - "3000:3000"
    depends_on:
      - livekit
    networks:
      - lknetwork
